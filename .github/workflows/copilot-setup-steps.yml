name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/AirlockPlugin/package-lock.json

      - name: Install Airlock plugin dependencies
        working-directory: plugins/AirlockPlugin
        run: npm ci

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video-build system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            fonts-inter \
            fonts-noto-color-emoji \
            asciinema

      - name: Install agg (asciinema -> mp4/gif renderer)
        run: |
          curl -fL -o /tmp/agg https://github.com/asciinema/agg/releases/download/v1.5.0/agg-x86_64-unknown-linux-gnu
          chmod +x /tmp/agg
          sudo mv /tmp/agg /usr/local/bin/agg
          agg --version

      - name: Install Piper TTS (offline neural voice) + default voice
        run: |
          curl -fL -o /tmp/piper.tar.gz https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_linux_x86_64.tar.gz
          mkdir -p "$HOME/.local/piper"
          tar -xzf /tmp/piper.tar.gz -C "$HOME/.local/piper" --strip-components=1
          echo "$HOME/.local/piper" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/piper/voices"
          curl -fL -o "$HOME/.local/piper/voices/en_US-amy-medium.onnx" \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx
          curl -fL -o "$HOME/.local/piper/voices/en_US-amy-medium.onnx.json" \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json

      - name: Install Python video/audio libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            edge-tts \
            imageio-ffmpeg \
            pillow \
            numpy \
            requests

      - name: Sanity checks
        run: |
          node --version
          python --version
          ffmpeg -version | head -n 1
          asciinema --version
          agg --version
          piper --version || true
          echo "Piper voice: $(ls -l $HOME/.local/piper/voices)"
