name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/AirlockPlugin/package-lock.json

      - name: Install Airlock plugin dependencies
        working-directory: plugins/AirlockPlugin
        run: npm ci

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video-build system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            fonts-noto-color-emoji

      - name: Install Python video/audio libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            edge-tts \
            imageio-ffmpeg \
            pillow \
            numpy \
            requests

      - name: Sanity checks
        run: |
          node --version
          python --version
          ffmpeg -version | head -n 1
          python -c "import edge_tts, PIL, imageio_ffmpeg; print('python libs ok')"
