title = "Airlock outbound demo"

[extend]
useDefault = true

[[rules]]
id = "airlock-synthetic-secret"
description = "Nonfunctional marker for the Airlock demo"
regex = '''AIRLOCK_SYNTHETIC_SECRET_[A-Za-z0-9]{24}'''
keywords = ["AIRLOCK_SYNTHETIC_SECRET_"]

# Defaults can miss generic credentials in supplied headers and low-entropy log fields.
# Deliberately contextual, with no entropy exception; defaults remain enabled above.
# Match/redact the whole contextual field, so the default repeated-letter secret
# allowlist cannot suppress a credential merely because its value repeats.
[[rules]]
id = "airlock-authorization-token"
description = "Credential in an Authorization header or header-like log field"
regex = '''(?i)\b(?:proxy-)?authorization["']?[ \t]*[:=][ \t]*["']?(?:bearer|basic)[ \t]+[a-z0-9_./+~=-]{16,}(?:["'\s,;]|$)'''
keywords = ["authorization"]

[[rules]]
id = "airlock-oauth-token-field"
description = "Credential in an access_token or refresh_token log field"
regex = '''(?i)\b(?:access_token|refresh_token)["']?[ \t]*[:=][ \t]*["']?[a-z0-9_./+~=-]{16,}(?:["'\s,;}&]|$)'''
keywords = ["access_token", "refresh_token"]
